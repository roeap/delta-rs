[workspace]
members = ["crates/*", "python"]
exclude = []
resolver = "3"

[workspace.package]
authors = ["Qingping Hou <dave2008713@gmail.com>", "R Tyler Croy <rtyler@brokenco.de>"]
rust-version = "1.91.1"
keywords = ["deltalake", "delta", "datalake"]
readme = "README.md"
edition = "2024"
description = "Native Delta Lake implementation in Rust"
homepage = "https://github.com/delta-io/delta.rs"
license = "Apache-2.0"
documentation = "https://docs.rs/deltalake"
repository = "https://github.com/delta-io/delta.rs"

[workspace.dependencies]
# Repointed to the delta-kernel-rs `sm-plans-consolidation` line. The classic
# scan/snapshot path this crate uses is signature-stable across this line: the
# only source change required (vs 530e94d) was implementing the newly-added
# `StorageHandler::delete`. The bump to 1a9b592c608a4f4c000dddb2bf6134e0ec66f2e6 adds only the logical
# scan-file-row scan terminal + `Scan::scan_file_row_schema` accessor and the
# `FullState::output_schema` accessor + FSR terminal projection, all entirely
# inside the `sm-plans` feature this crate does NOT enable, so the compiled
# surface here is unchanged. This one-line bump keeps delta-rs's kernel rev in
# lock-step with the mangrove workspace's (the single-rev invariant: both must
# pin the SAME kernel rev so `delta_kernel` unifies to one build). Adopting the
# kernel's sm_plans state-machine scan API (to retire the home-grown
# ExecutorHandle/InlineExecutor bridge) is a tracked follow-up, not part of this bump.
#
# NOTE: rev 1a9b592c608a4f4c000dddb2bf6134e0ec66f2e6 must be pushed to the roeap fork before this resolves for
# anyone else / in CI. For local development against an adjacent checkout, swap
# the `git`+`rev` for `path = "../delta-kernel-rs/kernel"` (and the default-engine
# path); do not commit the path form.
#
# Both crates MUST pin `arrow-58` with default-features OFF: the kernel's `arrow`
# default alias is arrow-59, and delta_kernel_default_engine's `default` enables
# it — leaving defaults on would union arrow-59 into this arrow-58 graph, which
# splits `arrow_schema::Schema` from `delta_kernel::arrow::datatypes::Schema`.
delta_kernel = { git = "https://github.com/roeap/delta-kernel-rs", rev = "1a9b592c608a4f4c000dddb2bf6134e0ec66f2e6", package = "delta_kernel", default-features = false, features = [
    "arrow-58",
    "internal-api",
    # gates the `engine` module + arrow_conversion/arrow_data/arrow_expression
    # submodules (used throughout delta-rs core).
    "default-engine-base",
] }
# native-only (hard tokio rt-multi-thread); on wasm the host supplies its own engine.
# default-features off + explicit arrow-58/rustls to avoid pulling the arrow-59 default.
delta_kernel_default_engine = { git = "https://github.com/roeap/delta-kernel-rs", rev = "1a9b592c608a4f4c000dddb2bf6134e0ec66f2e6", package = "delta_kernel_default_engine", default-features = false, features = [
    "arrow-58",
    "rustls",
] }


# arrow
arrow = { version = "58" }
arrow-arith = { version = "58" }
arrow-array = { version = "58", features = ["chrono-tz"] }
arrow-buffer = { version = "58" }
arrow-cast = { version = "58" }
arrow-ipc = { version = "58" }
arrow-json = { version = "58" }
arrow-ord = { version = "58" }
arrow-row = { version = "58" }
arrow-schema = { version = "58" }
arrow-select = { version = "58" }
object_store = { version = "0.13.2" }
parquet = { version = "58" }

# datafusion 54
# Default features minus `compression`: async-compression pulls C codecs
# (liblzma/bzip2/zstd-sys) that cannot build for wasm32-unknown-unknown.
# Native builds re-enable `compression` via a target-gated dependency entry
# in crates/core, so the native feature set is unchanged.
datafusion = { version = "54.0.0", default-features = false, features = [
    "nested_expressions",
    "crypto_expressions",
    "datetime_expressions",
    "encoding_expressions",
    "regex_expressions",
    "string_expressions",
    "unicode_expressions",
    "parquet",
    "recursive_protection",
    "sql",
] }
datafusion-datasource = { version = "54.0.0", default-features = false }
datafusion-physical-expr-adapter = { version = "54.0.0" }
datafusion-ffi = { version = "54.0.0" }
datafusion-proto = { version = "54.0.0" }

# serde
serde = { version = "1.0.194", features = ["derive"] }
serde_json = "1"
strum = { version = "0.27" }

# "stdlib"
bytes = { version = "1" }
chrono = { version = "0.4.40", default-features = false, features = ["clock"] }
time = { version = "=0.3.47" }
tracing = { version = "0.1", features = ["log"] }
regex = { version = "1" }
thiserror = { version = "2" }
url = { version = "2" }
percent-encoding-rfc3986 = { version = "0.1.3" }
tempfile = { version = "3" }
uuid = { version = "1" }

# runtime / async
async-trait = { version = "0.1" }
futures = { version = "0.3" }
tokio = { version = "1" }
typed-builder = { version = "0.23.0" }

# opentelemetry
tracing-opentelemetry = { version = "0.32" }
opentelemetry = { version = "0.31" }
opentelemetry-otlp = { version = "0.31", features = ["http-proto"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
num_cpus = { version = "1" }

# wasm-engine: patch parquet (and the arrow family it pins) to the
# wasm-codec-58.3.0 branch of the arrow-rs fork, pinned by rev. That fork's
# parquet `default` features drop the C-backed zstd/brotli codecs and
# target-gate arrow-ipc's zstd dep, so the graph builds for
# wasm32-unknown-unknown. Same 58.3.0 version as crates.io, so native builds
# are unaffected except for the missing zstd/brotli defaults. This must stay a
# patch, not a feature flag: datafusion-datasource-parquet and the kernel
# declare `parquet` without `default-features = false`, and Cargo unions
# features graph-wide, so no delta-rs feature can turn zstd/brotli off. See
# WASM.md.
[patch.crates-io]
parquet = { git = "https://github.com/roeap/arrow-rs", rev = "e76f4cfda8efc00f17d810d854cf6cb72412f1ab", package = "parquet" }
arrow = { git = "https://github.com/roeap/arrow-rs", rev = "e76f4cfda8efc00f17d810d854cf6cb72412f1ab", package = "arrow" }
arrow-arith = { git = "https://github.com/roeap/arrow-rs", rev = "e76f4cfda8efc00f17d810d854cf6cb72412f1ab", package = "arrow-arith" }
arrow-array = { git = "https://github.com/roeap/arrow-rs", rev = "e76f4cfda8efc00f17d810d854cf6cb72412f1ab", package = "arrow-array" }
arrow-buffer = { git = "https://github.com/roeap/arrow-rs", rev = "e76f4cfda8efc00f17d810d854cf6cb72412f1ab", package = "arrow-buffer" }
arrow-cast = { git = "https://github.com/roeap/arrow-rs", rev = "e76f4cfda8efc00f17d810d854cf6cb72412f1ab", package = "arrow-cast" }
arrow-data = { git = "https://github.com/roeap/arrow-rs", rev = "e76f4cfda8efc00f17d810d854cf6cb72412f1ab", package = "arrow-data" }
arrow-ipc = { git = "https://github.com/roeap/arrow-rs", rev = "e76f4cfda8efc00f17d810d854cf6cb72412f1ab", package = "arrow-ipc" }
arrow-json = { git = "https://github.com/roeap/arrow-rs", rev = "e76f4cfda8efc00f17d810d854cf6cb72412f1ab", package = "arrow-json" }
arrow-ord = { git = "https://github.com/roeap/arrow-rs", rev = "e76f4cfda8efc00f17d810d854cf6cb72412f1ab", package = "arrow-ord" }
arrow-row = { git = "https://github.com/roeap/arrow-rs", rev = "e76f4cfda8efc00f17d810d854cf6cb72412f1ab", package = "arrow-row" }
arrow-schema = { git = "https://github.com/roeap/arrow-rs", rev = "e76f4cfda8efc00f17d810d854cf6cb72412f1ab", package = "arrow-schema" }
arrow-select = { git = "https://github.com/roeap/arrow-rs", rev = "e76f4cfda8efc00f17d810d854cf6cb72412f1ab", package = "arrow-select" }
arrow-string = { git = "https://github.com/roeap/arrow-rs", rev = "e76f4cfda8efc00f17d810d854cf6cb72412f1ab", package = "arrow-string" }

[workspace.metadata.typos]
files.extend-exclude = ["CHANGELOG.md", "crates/benchmarks/queries/tpcds/*.sql"]
default.extend-ignore-re = [
    # Custom ignore regex patterns: https://github.com/crate-ci/typos/blob/master/docs/reference.md#example-configurations
    "(?s)//\\s*spellchecker:ignore-next-line[^\\n]*\\n[^\\n]*",
    # Line block with # spellchecker:<on|off>
    "(?s)(#|//|<\\!--)\\s*spellchecker:off.*?\\n\\s*(#|//|<\\!--)\\s*spellchecker:on",
    "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",
    # workaround for: https://github.com/crate-ci/typos/issues/850
    "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}",
]

[workspace.metadata.typos.default.extend-words]
arro = "arro"
Arro = "Arro"
arro3 = "arro3"
Arro3 = "Arro3"
AKS = "AKS"
# to avoid using 'type' as a field name.
tpe = "tpe"

# ============================================================================
# Profile Configuration
# ============================================================================
# Profiles for different use cases:
# - dev: Fast local development with good debug experience (Cargo defaults)
# - test: test builds with minimal debug info to save disk/RAM (custom)
# - release: Production Rust crates - maximum performance (Cargo defaults)
# - bench: For benchmarking with flamegraphs (cargo bench)
# - profiling: For performance profiling with release opts + debug info
# - ci: CI/CD optimized - fast builds, release-like performance
# - python-release: Python wheel builds - portable, reproducible (PyPI releases)
# ============================================================================

# Test profile - reduced debug info to save disk/RAM
# Usage: cargo test (automatic)
# <https://github.com/delta-io/delta-rs/issues/1550>
[profile.test]
debug = "line-tables-only"

# Benchmark profile with debug symbols for flamegraphs
# Usage: cargo bench (automatic)
[profile.bench]
debug = true

# Profiling profile with release optimizations + debug info
# Usage: cargo build --profile=profiling
[profile.profiling]
inherits = "release"
debug = true

# CI profile - optimized for Continuous Integration
# Usage: cargo build --profile=ci
[profile.ci]
inherits = "dev"
debug = false
incremental = false

[profile.ci.package."*"]
opt-level = 3
debug = false
debug-assertions = false
strip = "debuginfo"
incremental = false

# Python wheel release profile - for PyPI distribution
# Usage: maturin build --profile python-release (via .github/workflows/python_release.yml)
[profile.python-release]
inherits = "release"
opt-level = 3
codegen-units = 1
lto = "fat"


# Python wheel release profile ARM - for PyPI distribution
# Usage: maturin build --profile python-release-arm (via .github/workflows/python_release.yml)
[profile.python-release-arm]
inherits = "release"
opt-level = 3
codegen-units = 1
lto = "thin"
